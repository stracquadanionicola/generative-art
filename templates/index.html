<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aetheria Studio — Generatore di Immagini</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='1' x2='1' y2='0'%3E%3Cstop offset='0' stop-color='%235c3568'/%3E%3Cstop offset='1' stop-color='%23caa0ad'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='24' fill='%232a2130'/%3E%3Cpath d='M22 72 C28 44 42 26 70 21' stroke='url(%23g)' stroke-width='9' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='72' cy='22' r='8' fill='url(%23g)'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    color-scheme: dark;
    --bg: #241b28;
    --bg-soft: #34293a;
    --bg-elevated: #3c2f43;
    --border: rgba(244,232,216,0.14);
    --text: #f4ecdf;
    --text-dim: #cbb9c6;
    --text-faint: #8d7690;
    --accent: #6b3f78;
    --accent-hover: #7d4c8c;
    --accent-rose: #caa0ad;
    --cream: #efe4d1;
    --cream-2: #e6d8bf;
    --ink: #382a37;
    --ink-dim: #6d5868;
    --danger: #c1503f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:
      radial-gradient(ellipse 760px 480px at 18% -8%, rgba(202,160,173,0.16), transparent 60%),
      radial-gradient(ellipse 640px 460px at 92% 6%, rgba(107,63,120,0.28), transparent 55%),
      var(--bg);
    background-attachment: fixed;
  }
  .page {
    max-width: 760px;
    margin: 0 auto;
    padding: 60px 20px 64px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header { text-align: center; margin-bottom: 34px; position: relative; }
  .eyebrow {
    font-size: 0.7rem; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--accent-rose); margin: 0 0 14px;
  }
  .brand { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 0 0 14px; position: relative; }
  .brand::before {
    content: ""; position: absolute; left: 50%; top: 50%;
    width: 220px; height: 220px; transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(202,160,173,0.22), transparent 70%);
    z-index: -1;
  }
  .brand svg { width: 32px; height: 32px; flex-shrink: 0; }
  .brand span {
    font-family: "Playfair Display", serif;
    font-size: 2rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  p.hint { color: var(--text-dim); margin: 0 auto; font-size: 0.94rem; line-height: 1.55; text-align: center; max-width: 460px; min-height: 2.9em; }

  .mode-toggle {
    display: flex; gap: 4px; margin: 28px 0 24px;
    background: var(--bg-soft); padding: 5px; border-radius: 999px; border: 1px solid var(--border);
  }
  .mode-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 10px 18px; border-radius: 999px; border: none; background: transparent;
    color: var(--text-dim); font-size: 0.85rem; font-weight: 500; font-family: inherit; cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
    white-space: nowrap;
  }
  .mode-btn:hover:not(.active) { color: var(--text); background: rgba(244,232,216,0.06); }
  .mode-btn.active { background: var(--accent); color: var(--cream); font-weight: 600; }

  form { width: 100%; max-width: 580px; display: flex; gap: 10px; }
  form[hidden] { display: none; }

  textarea {
    flex: 1;
    resize: none;
    height: 56px;
    padding: 16px 18px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--bg-soft);
    color: var(--text);
    font-size: 0.95rem;
    font-family: inherit;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  textarea::placeholder { color: var(--text-faint); }
  textarea:focus { outline: none; border-color: var(--accent-rose); box-shadow: 0 0 0 3px rgba(202,160,173,0.2); }

  button.submit {
    padding: 0 28px;
    border-radius: 999px;
    border: none;
    background: var(--accent);
    color: var(--cream);
    font-weight: 600;
    font-size: 0.95rem;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  button.submit:hover:not(:disabled) { background: var(--accent-hover); }
  button.submit:active:not(:disabled) { transform: scale(0.97); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .kbd-hint { margin-top: 12px; color: var(--text-faint); font-size: 0.74rem; text-align: center; }
  .kbd-hint kbd {
    font-family: inherit; background: var(--bg-soft); border: 1px solid var(--border);
    border-radius: 4px; padding: 1px 6px; font-size: 0.72rem;
  }

  .dropzone {
    flex: 1;
    display: flex; align-items: center; gap: 12px;
    padding: 10px 18px;
    border-radius: 999px;
    border: 1px dashed var(--border);
    background: var(--bg-soft);
    color: var(--text-faint);
    font-size: 0.85rem;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .dropzone:hover, .dropzone.drag { border-color: var(--accent-rose); color: var(--text-dim); }
  .dropzone.has-file { color: var(--text); border-style: solid; }
  .dropzone img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
  .dropzone input { display: none; }

  .result-card {
    margin-top: 38px;
    width: 100%;
    max-width: 640px;
    border-radius: 24px;
    background: var(--cream);
    box-shadow: 0 24px 60px -24px rgba(0,0,0,0.55);
    overflow: hidden;
  }
  .canvas-wrap {
    width: 100%;
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    background: var(--cream-2);
  }
  .canvas-wrap img, .canvas-wrap canvas {
    max-width: 100%; max-height: 100%; width: auto; height: auto;
    display: block; animation: reveal 0.4s ease;
  }
  @keyframes reveal { from { opacity: 0; transform: scale(1.02); } to { opacity: 1; transform: scale(1); } }
  .placeholder { color: var(--ink-dim); font-size: 0.9rem; text-align: center; padding: 20px; font-family: "Playfair Display", serif; font-style: italic; }
  .spinner-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid rgba(56,42,55,0.15);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  .spinner-label { color: var(--ink-dim); font-size: 0.8rem; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .result-text {
    padding: 18px 22px; border-top: 1px solid rgba(56,42,55,0.12);
    color: var(--ink); font-size: 0.94rem; line-height: 1.6;
  }
  .result-text[hidden] { display: none; }

  .result-footer {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 22px; border-top: 1px solid rgba(56,42,55,0.12);
  }
  .result-footer[hidden] { display: none; }
  .meta { color: var(--ink-dim); font-size: 0.76rem; }
  .result-footer a {
    color: var(--ink); font-size: 0.8rem; text-decoration: none;
    border: 1px solid rgba(56,42,55,0.2); padding: 6px 14px; border-radius: 999px;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .result-footer a:hover { border-color: var(--accent); background: rgba(107,63,120,0.08); }

  .error { color: var(--danger); margin-top: 16px; font-size: 0.88rem; text-align: center; max-width: 500px; }

  footer { margin-top: 60px; color: var(--text-faint); font-size: 0.76rem; text-align: center; }
  footer a { color: var(--text-dim); text-decoration: none; border-bottom: 1px solid var(--border); }
  footer a:hover { color: var(--text); border-color: var(--accent-rose); }

  @media (max-width: 520px) {
    form { flex-direction: column; }
    button.submit { padding: 13px; }
    .mode-toggle { flex-wrap: wrap; justify-content: center; border-radius: 18px; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <p class="eyebrow">AI Image Studio</p>
    <div class="brand">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <linearGradient id="logo-g" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#6b3f78" />
            <stop offset="1" stop-color="#caa0ad" />
          </linearGradient>
        </defs>
        <rect width="100" height="100" rx="24" fill="#34293a" />
        <path d="M22 72 C28 44 42 26 70 21" stroke="url(#logo-g)" stroke-width="9" fill="none" stroke-linecap="round" />
        <circle cx="72" cy="22" r="8" fill="url(#logo-g)" />
      </svg>
      <span>Aetheria Studio</span>
    </div>
    <p class="hint" id="hint"></p>
  </header>

  <div class="mode-toggle" id="mode-toggle">
    <button type="button" class="mode-btn active" data-mode="generate">✨ Testo → Immagine</button>
    <button type="button" class="mode-btn" data-mode="describe">📝 Descrivi immagine</button>
    <button type="button" class="mode-btn" data-mode="detect">🔎 Rileva oggetti</button>
  </div>

  <form id="text-form">
    <textarea id="prompt" placeholder="" maxlength="200"></textarea>
    <button type="submit" class="submit" id="text-submit-btn">Genera</button>
  </form>

  <form id="upload-form" hidden>
    <label class="dropzone" id="dropzone" for="file-input">
      <span id="dropzone-label">Scegli o trascina un'immagine</span>
      <input type="file" id="file-input" accept="image/*" />
    </label>
    <button type="submit" class="submit" id="upload-submit-btn" disabled>Analizza</button>
  </form>

  <p class="kbd-hint" id="kbd-hint">Invio per generare · <kbd>Shift</kbd>+<kbd>Invio</kbd> per andare a capo</p>

  <div class="result-card">
    <div class="canvas-wrap" id="canvas-wrap">
      <div class="placeholder" id="placeholder">Il risultato apparirà qui</div>
    </div>
    <p class="result-text" id="result-text" hidden></p>
    <div class="result-footer" id="result-footer" hidden>
      <span class="meta" id="meta"></span>
      <a id="open-link" href="#" target="_blank" rel="noopener">Apri a schermo intero ↗</a>
    </div>
  </div>
  <div class="error" id="error" hidden></div>

  <footer>
    <a href="https://github.com/stracquadanionicola/generative-art" target="_blank" rel="noopener">codice sorgente</a>
    · powered by Cloudflare Workers AI
  </footer>
</div>

<script>
  const textForm = document.getElementById("text-form");
  const uploadForm = document.getElementById("upload-form");
  const promptEl = document.getElementById("prompt");
  const textSubmitBtn = document.getElementById("text-submit-btn");
  const uploadSubmitBtn = document.getElementById("upload-submit-btn");
  const dropzone = document.getElementById("dropzone");
  const dropzoneLabel = document.getElementById("dropzone-label");
  const fileInput = document.getElementById("file-input");
  const kbdHint = document.getElementById("kbd-hint");
  const canvasWrap = document.getElementById("canvas-wrap");
  const resultText = document.getElementById("result-text");
  const resultFooter = document.getElementById("result-footer");
  const openLink = document.getElementById("open-link");
  const errorEl = document.getElementById("error");
  const metaEl = document.getElementById("meta");
  const hintEl = document.getElementById("hint");
  const modeBtns = document.querySelectorAll(".mode-btn");

  const MODES = {
    generate: {
      kind: "text",
      endpoint: "/cf/text-to-image",
      hint: "Descrivi l'immagine che vuoi creare — generata da zero tramite Cloudflare Workers AI (Flux).",
      placeholder: "es. un gatto arancione seduto su un tetto, stile acquerello",
      spinnerLabel: "Generazione in corso (può richiedere qualche secondo)…",
    },
    describe: {
      kind: "upload",
      endpoint: "/cf/describe",
      hint: "Carica un'immagine: un modello visione (LLaVA) la osserva e ne scrive una descrizione.",
      spinnerLabel: "Analisi dell'immagine in corso…",
    },
    detect: {
      kind: "upload",
      endpoint: "/cf/detect",
      hint: "Carica un'immagine: viene rilevato ogni oggetto riconoscibile, con etichetta e riquadro.",
      spinnerLabel: "Rilevamento oggetti in corso…",
    },
  };

  let mode = "generate";
  let selectedFile = null;

  function applyMode(newMode) {
    mode = newMode;
    modeBtns.forEach((b) => b.classList.toggle("active", b.dataset.mode === mode));
    const cfg = MODES[mode];
    hintEl.textContent = cfg.hint;

    const isText = cfg.kind === "text";
    textForm.hidden = !isText;
    uploadForm.hidden = isText;
    kbdHint.hidden = !isText;
    if (isText) promptEl.placeholder = cfg.placeholder;
  }

  modeBtns.forEach((b) => b.addEventListener("click", () => applyMode(b.dataset.mode)));
  applyMode("generate");

  dropzone.addEventListener("dragover", (e) => { e.preventDefault(); dropzone.classList.add("drag"); });
  dropzone.addEventListener("dragleave", () => dropzone.classList.remove("drag"));
  dropzone.addEventListener("drop", (e) => {
    e.preventDefault();
    dropzone.classList.remove("drag");
    if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener("change", () => {
    if (fileInput.files[0]) setFile(fileInput.files[0]);
  });

  function setFile(file) {
    selectedFile = file;
    uploadSubmitBtn.disabled = false;
    dropzone.classList.add("has-file");
    const url = URL.createObjectURL(file);
    dropzoneLabel.textContent = file.name;
    const thumb = document.createElement("img");
    thumb.src = url;
    dropzone.querySelector("img")?.remove();
    dropzone.prepend(thumb);
  }

  function resetResultArea(spinnerLabel) {
    errorEl.hidden = true;
    resultFooter.hidden = true;
    resultText.hidden = true;
    canvasWrap.style.aspectRatio = "1 / 1";
    canvasWrap.innerHTML = `<div class="spinner-wrap"><div class="spinner"></div><div class="spinner-label">${spinnerLabel}</div></div>`;
  }

  function showError(message) {
    canvasWrap.innerHTML = '<div class="placeholder">Nessun risultato</div>';
    errorEl.textContent = message;
    errorEl.hidden = false;
  }

  function loadLocalImage(file) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.src = URL.createObjectURL(file);
    });
  }

  async function generateFromText(prompt) {
    resetResultArea(MODES.generate.spinnerLabel);
    textSubmitBtn.disabled = true;

    let data;
    try {
      const res = await fetch(MODES.generate.endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt }),
      });
      data = await res.json();
      if (!res.ok) throw new Error(data.error || "Errore sconosciuto");
    } catch (err) {
      showError(err.message);
      textSubmitBtn.disabled = false;
      return;
    }

    const img = new Image();
    img.alt = prompt;
    img.onload = () => {
      canvasWrap.style.aspectRatio = `${img.naturalWidth} / ${img.naturalHeight}`;
      canvasWrap.innerHTML = "";
      canvasWrap.appendChild(img);
      const p = data.params;
      metaEl.textContent = `sorgente: ${p.source} · seed: ${p.seed}`;
      openLink.href = data.image_url;
      resultFooter.hidden = false;
      textSubmitBtn.disabled = false;
    };
    img.onerror = () => {
      showError("Impossibile caricare l'immagine generata.");
      textSubmitBtn.disabled = false;
    };
    img.src = data.image_url;
  }

  async function describeImage(file) {
    resetResultArea(MODES.describe.spinnerLabel);
    uploadSubmitBtn.disabled = true;

    const localImg = await loadLocalImage(file);
    canvasWrap.style.aspectRatio = `${localImg.naturalWidth} / ${localImg.naturalHeight}`;

    const form = new FormData();
    form.append("image", file);

    let data;
    try {
      const res = await fetch(MODES.describe.endpoint, { method: "POST", body: form });
      data = await res.json();
      if (!res.ok) throw new Error(data.error || "Errore sconosciuto");
    } catch (err) {
      showError(err.message);
      uploadSubmitBtn.disabled = false;
      return;
    }

    canvasWrap.innerHTML = "";
    canvasWrap.appendChild(localImg);
    resultText.textContent = data.description;
    resultText.hidden = false;
    uploadSubmitBtn.disabled = false;
  }

  async function detectObjects(file) {
    resetResultArea(MODES.detect.spinnerLabel);
    uploadSubmitBtn.disabled = true;

    const localImg = await loadLocalImage(file);
    canvasWrap.style.aspectRatio = `${localImg.naturalWidth} / ${localImg.naturalHeight}`;

    const form = new FormData();
    form.append("image", file);

    let data;
    try {
      const res = await fetch(MODES.detect.endpoint, { method: "POST", body: form });
      data = await res.json();
      if (!res.ok) throw new Error(data.error || "Errore sconosciuto");
    } catch (err) {
      showError(err.message);
      uploadSubmitBtn.disabled = false;
      return;
    }

    const canvas = document.createElement("canvas");
    canvas.width = localImg.naturalWidth;
    canvas.height = localImg.naturalHeight;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(localImg, 0, 0);

    const objects = data.objects || [];
    const palette = ["#6b3f78", "#c1503f", "#3f6b5e", "#8c6a2f", "#3f5a78", "#8c3f6e"];
    ctx.lineWidth = Math.max(2, canvas.width / 300);
    ctx.font = `600 ${Math.max(14, canvas.width / 50)}px Inter, sans-serif`;
    ctx.textBaseline = "top";
    objects.forEach((obj, i) => {
      const color = palette[i % palette.length];
      const { xmin, ymin, xmax, ymax } = obj.box;
      ctx.strokeStyle = color;
      ctx.strokeRect(xmin, ymin, xmax - xmin, ymax - ymin);
      const label = `${obj.label} ${Math.round(obj.score * 100)}%`;
      const textWidth = ctx.measureText(label).width;
      ctx.fillStyle = color;
      ctx.fillRect(xmin, ymin, textWidth + 10, parseInt(ctx.font, 10) + 8);
      ctx.fillStyle = "#f4ecdf";
      ctx.fillText(label, xmin + 5, ymin + 4);
    });

    canvasWrap.innerHTML = "";
    canvasWrap.appendChild(canvas);
    resultText.textContent = objects.length
      ? `${objects.length} ${objects.length === 1 ? "oggetto rilevato" : "oggetti rilevati"}: ${objects.map((o) => o.label).join(", ")}`
      : "Nessun oggetto riconosciuto in questa immagine.";
    resultText.hidden = false;
    uploadSubmitBtn.disabled = false;
  }

  textForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const prompt = promptEl.value.trim();
    if (!prompt) return;
    generateFromText(prompt);
  });

  promptEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      textForm.requestSubmit();
    }
  });

  uploadForm.addEventListener("submit", (e) => {
    e.preventDefault();
    if (!selectedFile) return;
    if (mode === "describe") describeImage(selectedFile);
    else if (mode === "detect") detectObjects(selectedFile);
  });
</script>
</body>
</html>
