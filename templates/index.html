<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aetheria Studio — Generatore di Immagini</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='1' x2='1' y2='0'%3E%3Cstop offset='0' stop-color='%235c3568'/%3E%3Cstop offset='1' stop-color='%23caa0ad'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='24' fill='%232a2130'/%3E%3Cpath d='M22 72 C28 44 42 26 70 21' stroke='url(%23g)' stroke-width='9' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='72' cy='22' r='8' fill='url(%23g)'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    color-scheme: dark;
    --bg: #241b28;
    --bg-soft: #34293a;
    --bg-elevated: #3c2f43;
    --border: rgba(244,232,216,0.14);
    --text: #f4ecdf;
    --text-dim: #cbb9c6;
    --text-faint: #8d7690;
    --accent: #6b3f78;
    --accent-hover: #7d4c8c;
    --accent-rose: #caa0ad;
    --cream: #efe4d1;
    --cream-2: #e6d8bf;
    --ink: #382a37;
    --ink-dim: #6d5868;
    --danger: #c1503f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:
      radial-gradient(ellipse 760px 480px at 18% -8%, rgba(202,160,173,0.16), transparent 60%),
      radial-gradient(ellipse 640px 460px at 92% 6%, rgba(107,63,120,0.28), transparent 55%),
      var(--bg);
    background-attachment: fixed;
  }
  .page {
    max-width: 760px;
    margin: 0 auto;
    padding: 24px 20px 64px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .account-area { width: 100%; max-width: 320px; margin: 0 auto 20px; }
  .topbar {
    width: 100%; display: flex; align-items: center; justify-content: center;
    gap: 8px; min-height: 36px; line-height: 1;
  }
  .auth-link {
    background: none; border: none; color: var(--text-dim); font-family: inherit;
    font-size: 0.82rem; line-height: 1; cursor: pointer; padding: 4px 2px; margin: 0;
  }
  .auth-link:hover { color: var(--text); }
  .auth-sep { color: var(--text-faint); font-size: 0.82rem; line-height: 1; }

  .avatar-badge {
    width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
    background: var(--accent); color: var(--cream); font-family: "Playfair Display", serif;
    font-weight: 600; font-size: 0.9rem; display: flex; align-items: center; justify-content: center;
  }

  .auth-panel {
    width: 100%; margin-top: 12px;
    background: var(--bg-soft); border: 1px solid var(--border); border-radius: 18px;
    padding: 18px; display: flex; flex-direction: column; gap: 10px;
  }
  .auth-panel[hidden] { display: none; }
  .auth-panel form { flex-direction: column; margin-top: 0; max-width: none; }
  .auth-panel input {
    padding: 11px 14px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--bg-elevated); color: var(--text); font-size: 0.88rem; font-family: inherit;
  }
  .auth-panel input:focus { outline: none; border-color: var(--accent-rose); }
  .auth-panel button.submit { width: 100%; padding: 11px; }
  .auth-panel .error { margin: 0; font-size: 0.8rem; }

  .library-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(10,2,20,0.6);
    display: flex; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .library-overlay.open { opacity: 1; pointer-events: auto; }
  .library-overlay[hidden] { display: none; }

  .library-panel {
    width: 100%; max-width: 760px; max-height: 82vh; overflow-y: auto;
    background: var(--bg-soft); border-bottom: 1px solid var(--border);
    border-radius: 0 0 26px 26px;
    padding: 26px 28px 32px;
    transform: translateY(-100%);
    transition: transform 0.3s ease;
    box-shadow: 0 30px 70px -20px rgba(0,0,0,0.6);
  }
  .library-overlay.open .library-panel { transform: translateY(0); }

  .library-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 22px;
  }
  .library-title {
    font-family: "Playfair Display", serif; font-size: 1.5rem; font-weight: 600;
    color: var(--text); margin: 0;
  }
  .library-close {
    width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border);
    background: none; color: var(--text-dim); font-size: 1rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .library-close:hover { color: var(--text); border-color: var(--accent-rose); }

  .library-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px;
  }
  .library-item {
    display: block; aspect-ratio: 1/1; border-radius: 12px; overflow: hidden;
    border: 1px solid var(--border); background: var(--bg-elevated);
    padding: 0; cursor: pointer;
  }
  .library-grid img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.2s ease; }
  .library-item:hover img { transform: scale(1.06); }
  .library-empty { color: var(--text-faint); font-size: 0.9rem; text-align: center; padding: 30px 0; }

  header { text-align: center; margin-bottom: 34px; position: relative; }
  .eyebrow {
    font-size: 0.7rem; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--accent-rose); margin: 0 0 14px;
  }
  .brand { display: flex; align-items: center; justify-content: center; gap: 12px; position: relative; }
  .brand::before {
    content: ""; position: absolute; left: 50%; top: 50%;
    width: 220px; height: 220px; transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(202,160,173,0.22), transparent 70%);
    z-index: -1;
  }
  .brand svg { width: 32px; height: 32px; flex-shrink: 0; }
  .brand span {
    font-family: "Playfair Display", serif;
    font-size: 2rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--text);
  }

  form { width: 100%; max-width: 580px; display: flex; gap: 10px; margin-top: 28px; }

  textarea {
    flex: 1;
    resize: none;
    height: 56px;
    padding: 16px 18px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--bg-soft);
    color: var(--text);
    font-size: 0.95rem;
    font-family: inherit;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  textarea:focus { outline: none; border-color: var(--accent-rose); box-shadow: 0 0 0 3px rgba(202,160,173,0.2); }
  textarea::placeholder { color: var(--text-faint); opacity: 0.7; }

  button.submit {
    padding: 0 28px;
    border-radius: 999px;
    border: none;
    background: var(--accent);
    color: var(--cream);
    font-weight: 600;
    font-size: 0.95rem;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  button.submit:hover:not(:disabled) { background: var(--accent-hover); }
  button.submit:active:not(:disabled) { transform: scale(0.97); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .result-card {
    margin-top: 38px;
    width: 100%;
    max-width: 640px;
    border-radius: 24px;
    background: var(--cream);
    box-shadow: 0 24px 60px -24px rgba(0,0,0,0.55);
    overflow: hidden;
  }
  .canvas-wrap {
    width: 100%;
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    background: var(--cream-2);
  }
  .canvas-wrap img {
    max-width: 100%; max-height: 100%; width: auto; height: auto;
    display: block; animation: reveal 0.4s ease;
  }
  @keyframes reveal { from { opacity: 0; transform: scale(1.02); } to { opacity: 1; transform: scale(1); } }
  .placeholder { color: var(--ink-dim); font-size: 0.9rem; text-align: center; padding: 20px; font-family: "Playfair Display", serif; font-style: italic; }
  .spinner-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid rgba(56,42,55,0.15);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  .spinner-label { color: var(--ink-dim); font-size: 0.8rem; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .result-footer {
    display: flex; align-items: center; justify-content: center;
    padding: 14px 22px; border-top: 1px solid rgba(56,42,55,0.12);
  }
  .result-footer[hidden] { display: none; }
  .result-actions { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
  .result-footer a, .result-actions button {
    color: var(--ink); font-size: 0.8rem; text-decoration: none;
    border: 1px solid rgba(56,42,55,0.2); padding: 6px 14px; border-radius: 999px;
    transition: border-color 0.15s ease, background 0.15s ease;
    background: none; font-family: inherit; cursor: pointer; white-space: nowrap;
  }
  .result-footer a:hover, .result-actions button:hover { border-color: var(--accent); background: rgba(107,63,120,0.08); }

  .lightbox-overlay {
    position: fixed; inset: 0; z-index: 110;
    background: rgba(10,2,20,0.75);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .lightbox-overlay.open { opacity: 1; pointer-events: auto; }
  .lightbox-overlay[hidden] { display: none; }
  .lightbox-content {
    position: relative;
    width: 100%; max-width: 560px;
    background: var(--cream);
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 30px 70px -20px rgba(0,0,0,0.6);
    transform: scale(0.96);
    transition: transform 0.2s ease;
  }
  .lightbox-overlay.open .lightbox-content { transform: scale(1); }
  .lightbox-content img {
    width: 100%; max-height: 70vh; object-fit: contain; display: block; background: var(--cream-2);
  }
  .lightbox-content .result-footer { border-top: 1px solid rgba(56,42,55,0.12); }
  .lightbox-content .library-close {
    position: absolute; top: 12px; right: 12px; z-index: 5;
    background: rgba(244,236,223,0.9); border-color: transparent; color: var(--ink);
  }
  .lightbox-content .library-close:hover { background: var(--cream); border-color: var(--accent); }

  .error { color: var(--danger); margin-top: 16px; font-size: 0.88rem; text-align: center; max-width: 500px; }

  footer { margin-top: 60px; color: var(--text-faint); font-size: 0.76rem; text-align: center; line-height: 1.8; }
  footer a { color: var(--text-dim); text-decoration: none; border-bottom: 1px solid var(--border); }
  footer a:hover { color: var(--text); border-color: var(--accent-rose); }

  @media (max-width: 520px) {
    form { flex-direction: column; }
    button.submit { padding: 13px; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="account-area">
    <div class="topbar" id="topbar"></div>

    <div class="auth-panel" id="auth-panel" hidden>
      <form id="auth-form">
        <input type="text" id="auth-username-input" placeholder="Username" autocomplete="username" />
        <input type="password" id="auth-password-input" placeholder="Password" autocomplete="current-password" />
        <button type="submit" class="submit" id="auth-submit-btn">Accedi</button>
      </form>
      <p class="error" id="auth-error" hidden></p>
    </div>
  </div>

  <header>
    <p class="eyebrow">AI Image Studio</p>
    <div class="brand">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <linearGradient id="logo-g" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#6b3f78" />
            <stop offset="1" stop-color="#caa0ad" />
          </linearGradient>
        </defs>
        <rect width="100" height="100" rx="24" fill="#34293a" />
        <path d="M22 72 C28 44 42 26 70 21" stroke="url(#logo-g)" stroke-width="9" fill="none" stroke-linecap="round" />
        <circle cx="72" cy="22" r="8" fill="url(#logo-g)" />
      </svg>
      <span>Aetheria Studio</span>
    </div>
  </header>

  <form id="text-form">
    <textarea id="prompt" maxlength="200" placeholder="digita"></textarea>
    <button type="submit" class="submit" id="text-submit-btn">Genera</button>
  </form>

  <div class="result-card">
    <div class="canvas-wrap" id="canvas-wrap">
      <div class="placeholder" id="placeholder">Il risultato apparirà qui</div>
    </div>
    <div class="result-footer" id="result-footer" hidden>
      <div class="result-actions">
        <a id="download-link" href="#" download="aetheria-studio.png">Scarica ⬇</a>
        <button type="button" id="share-btn">Condividi ↗</button>
        <a id="open-link" href="#" target="_blank" rel="noopener">Schermo intero ↗</a>
      </div>
    </div>
  </div>
  <div class="error" id="error" hidden></div>

  <footer>
    Creato da Stracquadanio Nicola<br />
    <a href="https://github.com/stracquadanionicola/generative-art" target="_blank" rel="noopener">codice sorgente</a>
    · powered by Cloudflare Workers AI
  </footer>
</div>

<div class="library-overlay" id="library-overlay" hidden>
  <div class="library-panel" id="library-panel">
    <div class="library-header">
      <p class="library-title">Libreria</p>
      <button type="button" class="library-close" id="library-close" aria-label="Chiudi">✕</button>
    </div>
    <div class="library-grid" id="library-grid"></div>
    <p class="library-empty" id="library-empty" hidden>Genera la tua prima immagine per iniziare la libreria.</p>
  </div>
</div>

<div class="lightbox-overlay" id="lightbox-overlay" hidden>
  <div class="lightbox-content">
    <button type="button" class="library-close" id="lightbox-close" aria-label="Chiudi">✕</button>
    <img id="lightbox-img" alt="" />
    <div class="result-footer">
      <div class="result-actions">
        <a id="lightbox-download" href="#" download>Scarica ⬇</a>
        <button type="button" id="lightbox-share">Condividi ↗</button>
        <a id="lightbox-open" href="#" target="_blank" rel="noopener">Schermo intero ↗</a>
      </div>
    </div>
  </div>
</div>

<script>
  const topbar = document.getElementById("topbar");
  const authPanel = document.getElementById("auth-panel");
  const authForm = document.getElementById("auth-form");
  const authUsernameInput = document.getElementById("auth-username-input");
  const authPasswordInput = document.getElementById("auth-password-input");
  const authSubmitBtn = document.getElementById("auth-submit-btn");
  const authError = document.getElementById("auth-error");

  const textForm = document.getElementById("text-form");
  const promptEl = document.getElementById("prompt");
  const textSubmitBtn = document.getElementById("text-submit-btn");
  const canvasWrap = document.getElementById("canvas-wrap");
  const resultFooter = document.getElementById("result-footer");
  const openLink = document.getElementById("open-link");
  const downloadLink = document.getElementById("download-link");
  const shareBtn = document.getElementById("share-btn");
  const errorEl = document.getElementById("error");

  const libraryOverlay = document.getElementById("library-overlay");
  const libraryClose = document.getElementById("library-close");
  const libraryGrid = document.getElementById("library-grid");
  const libraryEmpty = document.getElementById("library-empty");

  const lightboxOverlay = document.getElementById("lightbox-overlay");
  const lightboxClose = document.getElementById("lightbox-close");
  const lightboxImg = document.getElementById("lightbox-img");
  const lightboxDownload = document.getElementById("lightbox-download");
  const lightboxShare = document.getElementById("lightbox-share");
  const lightboxOpen = document.getElementById("lightbox-open");

  let authMode = "login";
  let currentUser = null;
  let lastImageUrl = null;
  let lastPrompt = "";

  function slugify(text) {
    return (
      text.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "").slice(0, 40) || "immagine"
    );
  }

  async function shareImage(url, prompt, buttonEl) {
    if (!url) return;
    const absoluteUrl = new URL(url, window.location.origin).href;
    const originalLabel = buttonEl.textContent;

    const flash = (label) => {
      buttonEl.textContent = label;
      setTimeout(() => { buttonEl.textContent = originalLabel; }, 1800);
    };

    try {
      const resp = await fetch(url);
      const blob = await resp.blob();
      const file = new File([blob], "aetheria-studio.png", { type: blob.type || "image/png" });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: "Aetheria Studio", text: prompt });
        return;
      }
      if (navigator.share) {
        await navigator.share({ url: absoluteUrl, title: "Aetheria Studio", text: prompt });
        return;
      }
      throw new Error("share-unsupported");
    } catch (err) {
      if (err && err.name === "AbortError") return;
      try {
        await navigator.clipboard.writeText(absoluteUrl);
        flash("Link copiato ✓");
      } catch {
        flash("Copia non riuscita");
      }
    }
  }

  shareBtn.addEventListener("click", () => shareImage(lastImageUrl, lastPrompt, shareBtn));

  function openLightbox(url, prompt) {
    lightboxImg.src = url;
    lightboxImg.alt = prompt || "";
    lightboxDownload.href = url;
    lightboxDownload.download = `aetheria-${slugify(prompt || "immagine")}.png`;
    lightboxOpen.href = url;
    lightboxOverlay.hidden = false;
    requestAnimationFrame(() => {
      requestAnimationFrame(() => lightboxOverlay.classList.add("open"));
    });
  }

  function closeLightbox() {
    lightboxOverlay.classList.remove("open");
    setTimeout(() => { lightboxOverlay.hidden = true; }, 200);
  }

  lightboxClose.addEventListener("click", closeLightbox);
  lightboxOverlay.addEventListener("click", (e) => {
    if (e.target === lightboxOverlay) closeLightbox();
  });
  lightboxShare.addEventListener("click", () => shareImage(lightboxImg.src, lightboxImg.alt, lightboxShare));
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !lightboxOverlay.hidden) closeLightbox();
  });

  function openLibrary() {
    libraryOverlay.hidden = false;
    requestAnimationFrame(() => {
      requestAnimationFrame(() => libraryOverlay.classList.add("open"));
    });
    loadHistory();
  }

  function closeLibrary() {
    libraryOverlay.classList.remove("open");
    setTimeout(() => { libraryOverlay.hidden = true; }, 300);
  }

  libraryClose.addEventListener("click", closeLibrary);
  libraryOverlay.addEventListener("click", (e) => {
    if (e.target === libraryOverlay) closeLibrary();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !libraryOverlay.hidden) closeLibrary();
  });

  function renderTopbar() {
    topbar.innerHTML = "";
    if (currentUser) {
      const avatar = document.createElement("span");
      avatar.className = "avatar-badge";
      avatar.textContent = currentUser.charAt(0).toUpperCase();
      avatar.title = `Ciao, ${currentUser}`;

      const libraryBtn = document.createElement("button");
      libraryBtn.type = "button";
      libraryBtn.className = "auth-link";
      libraryBtn.textContent = "Cronologia";
      libraryBtn.addEventListener("click", openLibrary);

      const sep = document.createElement("span");
      sep.className = "auth-sep";
      sep.textContent = "-";

      const logoutBtn = document.createElement("button");
      logoutBtn.type = "button";
      logoutBtn.className = "auth-link";
      logoutBtn.textContent = "Esci";
      logoutBtn.addEventListener("click", doLogout);

      topbar.append(avatar, libraryBtn, sep, logoutBtn);
    } else {
      closeLibrary();
      const loginBtn = document.createElement("button");
      loginBtn.type = "button";
      loginBtn.className = "auth-link";
      loginBtn.textContent = "Accedi";
      loginBtn.addEventListener("click", () => openAuthPanel("login"));
      const sep = document.createElement("span");
      sep.className = "auth-sep";
      sep.textContent = "-";
      const registerBtn = document.createElement("button");
      registerBtn.type = "button";
      registerBtn.className = "auth-link";
      registerBtn.textContent = "Registrati";
      registerBtn.addEventListener("click", () => openAuthPanel("register"));
      topbar.append(loginBtn, sep, registerBtn);
    }
  }

  function openAuthPanel(newMode) {
    authMode = newMode;
    authError.hidden = true;
    authForm.reset();
    authSubmitBtn.textContent = authMode === "login" ? "Accedi" : "Crea account";
    authPasswordInput.autocomplete = authMode === "login" ? "current-password" : "new-password";
    authPanel.hidden = false;
    authUsernameInput.focus();
  }

  authForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    authError.hidden = true;
    authSubmitBtn.disabled = true;
    const username = authUsernameInput.value.trim();
    const password = authPasswordInput.value;

    try {
      const res = await fetch(authMode === "login" ? "/login" : "/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Errore sconosciuto");
      currentUser = data.username;
      authPanel.hidden = true;
      renderTopbar();
    } catch (err) {
      authError.textContent = err.message;
      authError.hidden = false;
    } finally {
      authSubmitBtn.disabled = false;
    }
  });

  async function doLogout() {
    await fetch("/logout", { method: "POST" });
    currentUser = null;
    renderTopbar();
    libraryGrid.innerHTML = "";
  }

  async function loadHistory() {
    if (!currentUser) return;
    try {
      const res = await fetch("/history");
      const data = await res.json();
      libraryGrid.innerHTML = "";
      const images = data.images || [];
      libraryEmpty.hidden = images.length > 0;
      libraryGrid.hidden = images.length === 0;
      images.forEach((img) => {
        const item = document.createElement("button");
        item.type = "button";
        item.className = "library-item";
        item.title = img.prompt;
        const image = document.createElement("img");
        image.src = img.image_url;
        image.alt = img.prompt;
        image.loading = "lazy";
        item.appendChild(image);
        item.addEventListener("click", () => openLightbox(img.image_url, img.prompt));
        libraryGrid.appendChild(item);
      });
    } catch {
      libraryEmpty.hidden = false;
      libraryGrid.hidden = true;
    }
  }

  async function init() {
    try {
      const res = await fetch("/me");
      const data = await res.json();
      if (data.username) currentUser = data.username;
    } catch {}
    renderTopbar();
  }
  init();

  function resetResultArea() {
    errorEl.hidden = true;
    resultFooter.hidden = true;
    canvasWrap.style.aspectRatio = "1 / 1";
    canvasWrap.innerHTML = '<div class="spinner-wrap"><div class="spinner"></div><div class="spinner-label">Generazione in corso (può richiedere qualche secondo)…</div></div>';
  }

  function showError(message) {
    canvasWrap.innerHTML = '<div class="placeholder">Nessun risultato</div>';
    errorEl.textContent = message;
    errorEl.hidden = false;
  }

  async function generateFromText(prompt) {
    resetResultArea();
    textSubmitBtn.disabled = true;

    let data;
    try {
      const res = await fetch("/cf/text-to-image", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt }),
      });
      data = await res.json();
      if (!res.ok) throw new Error(data.error || "Errore sconosciuto");
    } catch (err) {
      showError(err.message);
      textSubmitBtn.disabled = false;
      return;
    }

    const img = new Image();
    img.alt = prompt;
    img.onload = () => {
      canvasWrap.style.aspectRatio = `${img.naturalWidth} / ${img.naturalHeight}`;
      canvasWrap.innerHTML = "";
      canvasWrap.appendChild(img);
      openLink.href = data.image_url;
      downloadLink.href = data.image_url;
      downloadLink.download = `aetheria-${slugify(prompt)}.png`;
      lastImageUrl = data.image_url;
      lastPrompt = prompt;
      resultFooter.hidden = false;
      textSubmitBtn.disabled = false;
    };
    img.onerror = () => {
      showError("Impossibile caricare l'immagine generata.");
      textSubmitBtn.disabled = false;
    };
    img.src = data.image_url;
  }

  textForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const prompt = promptEl.value.trim();
    if (!prompt) return;
    generateFromText(prompt);
  });

  promptEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      textForm.requestSubmit();
    }
  });
</script>
</body>
</html>
